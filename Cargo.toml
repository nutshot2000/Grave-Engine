[package]
name = "grave-engine"
version = "0.1.0"
edition = "2024"
description = "A small 2D material-simulation engine and editor. Everything is plain text."
license = "MIT"

[dependencies]
eframe = "0.37"
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
png = "0.18"
rapier2d = "0.36"
gltf = "1.4"
tobj = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
